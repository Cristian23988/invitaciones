<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Una invitación especial de Rober & Eli.">
  <title>Rober & Eli — Invitación</title>
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="prefetch" href="Inicio.html">
</head>

<body>
  <main class="entrance">
    <div class="frame" aria-hidden="true"></div>
    <div class="light light-left" aria-hidden="true"></div>
    <div class="light light-right" aria-hidden="true"></div>

    <header class="topline">
      <span>UNA INVITACIÓN ESPECIAL</span>
      <span class="topline-mark">R <i>&</i> E</span>
    </header>

    <section class="intro" aria-labelledby="couple-names">
      <p class="eyebrow">CON ALEGRÍA EN NUESTROS CORAZONES</p>
      <h1 id="couple-names">Rober <span>&</span> Eli</h1>
      <p class="intro-copy">Queremos compartir contigo el comienzo de nuestra historia.</p>
    </section>

    <div class="invitation-stage">
      <a
        class="envelope"
        id="openInvitation"
        href="Inicio.html"
        aria-label="Abrir la invitación de Rober y Eli"
      >
        <span class="invitation-card" aria-hidden="true">
          <span class="card-overline">NOS CASAMOS</span>
          <span class="card-names">Rober <i>&</i> Eli</span>
          <span class="card-divider"></span>
          <span class="card-date">26 <i>·</i> 04 <i>·</i> 2026</span>
          <span class="card-place">RIONEGRO, ANTIOQUIA</span>
        </span>
        <span class="envelope-back" aria-hidden="true"></span>
        <span class="envelope-front" aria-hidden="true"></span>
        <span class="envelope-flap" aria-hidden="true"></span>
        <span class="wax-seal" aria-hidden="true">R<span>&</span>E</span>
      </a>
    </div>

    <p class="open-prompt" id="openPrompt">Toca la invitación para abrirla</p>

    <footer class="bottomline">
      <span>CON TODO NUESTRO CARIÑO</span>
      <span>ROBER & ELI</span>
    </footer>
  </main>

  <script src="assets/js/index.js"></script>
</body>
</html>
