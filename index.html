<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Rober & Eli te invitan a celebrar su boda.">
  <title>Rober & Eli — Invitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="prefetch" href="Inicio.html">
</head>
<body>
  <main class="opening" id="opening">
    <div class="opening-frame" aria-hidden="true"></div>
    <div class="opening-ground" aria-hidden="true"></div>

    <div class="invitation-reveal" aria-hidden="true">
      <p class="reveal-overline">Rober <span>&</span> Eli</p>
      <h1 class="reveal-title">
        <span class="title-line">ERES MUY IMPORTANTE</span>
        <span class="title-script">para nosotros</span>
      </h1>
    </div>

    <article class="final-invitation" aria-hidden="true">
      <div class="final-layout">
        <header class="final-heading">
          <p class="final-overline">Rober <span>&</span> Eli</p>
          <h2>TE INVITAMOS</h2>
          <p class="final-script">a celebrar nuestro amor</p>
        </header>
        <figure class="final-photo">
          <img src="assets/images/historia-6.jpg" alt="" fetchpriority="high" decoding="async">
        </figure>
        <p class="final-date">27 <span>·</span> DICIEMBRE <span>·</span> 2026</p>
      </div>
      <div class="final-frame" aria-hidden="true"></div>
    </article>

    <a
      class="envelope"
      id="openInvitation"
      href="Inicio.html"
      aria-label="Abrir la invitación de Rober y Eli"
      aria-keyshortcuts="Escape"
    >
      <span class="envelope-surface" aria-hidden="true"></span>
      <span class="envelope-fold fold-top" aria-hidden="true"></span>
      <span class="envelope-fold fold-left" aria-hidden="true"></span>
      <span class="envelope-fold fold-right" aria-hidden="true"></span>
      <span class="envelope-fold fold-bottom" aria-hidden="true"></span>
      <span class="wax-seal" aria-hidden="true">
        <img src="assets/images/sello-cera-marfil.webp" alt="" fetchpriority="high" decoding="async">
      </span>
    </a>

    <audio id="weddingAudio" preload="auto"></audio>

    <p class="open-prompt" id="openPrompt" aria-live="polite">Toca el sello para abrir</p>
  </main>

  <iframe id="invitationPage" title="Invitación de boda" aria-hidden="true"></iframe>

  <script src="assets/js/wedding-music.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
